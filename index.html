<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis XV Años - María José</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #FAF8F5;
            color: #444444;
        }

        .cuenta-regresiva {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px 20px;
        }

        h1 {
            margin: 0;

            font-family: Georgia, serif;
            font-size: 55px;
            font-weight: normal;

            color: #C8A96A;
        }

        .subtitulo {
            margin-top: 10px;

            font-size: 18px;
            letter-spacing: 1px;
        }

        .contador {
            display: flex;
            justify-content: center;
            gap: 20px;

            margin-top: 40px;
        }

        .tiempo {
            width: 120px;
            padding: 20px 10px;

            background-color: white;

            border: 1px solid #C8A96A;
            border-radius: 15px;
        }

        .numero {
            display: block;

            font-size: 38px;
            font-weight: bold;

            color: #C8A96A;
        }

        .etiqueta {
            display: block;

            margin-top: 8px;

            font-size: 11px;
            letter-spacing: 1px;
        }

        .frase {
            margin-top: 50px;

            font-family: Georgia, serif;
            font-size: 28px;

            color: #C8A96A;
        }

        .fecha {
            margin-top: 5px;

            font-size: 16px;
            letter-spacing: 4px;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 45px;
            }

            .subtitulo {
                font-size: 15px;
            }

            .contador {
                gap: 7px;
            }

            .tiempo {
                width: 75px;
                padding: 15px 5px;
            }

            .numero {
                font-size: 25px;
            }

            .etiqueta {
                font-size: 8px;
            }

            .frase {
                font-size: 24px;
            }
        }

    </style>

</head>

<body>

    <section class="cuenta-regresiva">

        <h1>Faltan</h1>

        <p class="subtitulo">
            Para celebrar una noche inolvidable
        </p>

        <div class="contador">

            <div class="tiempo">
                <span id="dias" class="numero">00</span>
                <span class="etiqueta">DÍAS</span>
            </div>

            <div class="tiempo">
                <span id="horas" class="numero">00</span>
                <span class="etiqueta">HORAS</span>
            </div>

            <div class="tiempo">
                <span id="minutos" class="numero">00</span>
                <span class="etiqueta">MINUTOS</span>
            </div>

            <div class="tiempo">
                <span id="segundos" class="numero">00</span>
                <span class="etiqueta">SEGUNDOS</span>
            </div>

        </div>

        <p class="frase">
            La cuenta regresiva ha comenzado...
        </p>

        <p class="fecha">
            30 · 01 · 2027
        </p>

    </section>


    <script>

        const fechaEvento =
            new Date("2027-01-30T19:00:00-05:00").getTime();


        const contador = setInterval(function () {

            const ahora = new Date().getTime();

            const diferencia = fechaEvento - ahora;


            const dias = Math.floor(
                diferencia / (1000 * 60 * 60 * 24)
            );


            const horas = Math.floor(
                (diferencia / (1000 * 60 * 60)) % 24
            );


            const minutos = Math.floor(
                (diferencia / (1000 * 60)) % 60
            );


            const segundos = Math.floor(
                (diferencia / 1000) % 60
            );


            document.getElementById("dias").textContent =
                dias.toString().padStart(2, "0");

            document.getElementById("horas").textContent =
                horas.toString().padStart(2, "0");

            document.getElementById("minutos").textContent =
                minutos.toString().padStart(2, "0");

            document.getElementById("segundos").textContent =
                segundos.toString().padStart(2, "0");


            if (diferencia <= 0) {

                clearInterval(contador);

                document.getElementById("dias").textContent = "00";
                document.getElementById("horas").textContent = "00";
                document.getElementById("minutos").textContent = "00";
                document.getElementById("segundos").textContent = "00";

            }

        }, 1000);

    </script>

</body>

</html>
