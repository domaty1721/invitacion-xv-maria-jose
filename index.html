<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis XV Años - María José</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: "Poppins", sans-serif;
        background-color: #FAF8F5;
        color: #444444;
    }

    .portada {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        text-align: center;

        padding: 40px 20px;

        background-color: #FAF8F5;
    }

    .contenido-portada {
        max-width: 700px;
    }

    .pequeno {
        font-size: 14px;

        letter-spacing: 4px;

        color: #C8A96A;

        margin-bottom: 20px;
    }

    h1 {
        font-family: "Great Vibes", cursive;

        font-size: 75px;

        font-weight: normal;

        color: #C8A96A;

        margin-bottom: 5px;
    }

    h2 {
        font-family: "Poppins", sans-serif;

        font-size: 28px;

        font-weight: 400;

        letter-spacing: 6px;

        color: #444444;

        margin-bottom: 30px;
    }

    .frase {
        max-width: 550px;

        margin: 0 auto 40px;

        font-size: 16px;

        line-height: 1.8;

        color: #444444;
    }

    .btn-abrir {
        border: none;

        background-color: #C8A96A;

        color: white;

        padding: 14px 35px;

        border-radius: 30px;

        font-family: "Poppins", sans-serif;

        font-size: 14px;

        cursor: pointer;

        transition: transform 0.3s ease,
                    box-shadow 0.3s ease;
    }

    .btn-abrir:hover {
        transform: translateY(-3px);

        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }


    /* CELULAR */

    @media (max-width: 600px) {

        h1 {
            font-size: 55px;
        }

        h2 {
            font-size: 22px;

            letter-spacing: 4px;
        }

        .frase {
            font-size: 14px;
        }

    }

</style>
</head>

<body>

    <!-- PORTADA -->

    <section class="portada">

        <div class="contenido-portada">

            <p class="pequeno">
                CON MUCHO AMOR
            </p>

            <h1>
                Mis XV Años
            </h1>

            <h2>
                María José
            </h2>

            <p class="frase">
                Hoy comienza un nuevo capítulo de mi vida
                y quiero compartirlo contigo.
            </p>

            <button class="btn-abrir">
                ✨ Abrir invitación
            </button>

        </div>

    </section>

</body>

</html>
